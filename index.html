<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chord Switch Trainer</title>
<style>
:root{--bg:#f1f4f1;--card:#fff;--soft:#e9eeea;--fg:#0e1913;--mut:#5b6b63;--ac:#0b7a63;--on:#fff;--bd:#dce4df;--hz:#f4b928;--hzt:#241800;--good:#168a52;--warn:#b57e00;--bad:#d1384f;--sh:0 1px 2px rgba(8,30,20,.06),0 6px 18px rgba(8,30,20,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a100e;--card:#131b18;--soft:#1b2622;--fg:#e9f2ed;--mut:#8da197;--ac:#4fd1b0;--on:#04221a;--bd:#25332d;--hz:#e9b12c;--hzt:#1a1200;--good:#4fd18a;--warn:#e9b12c;--bad:#ff6b82;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0a100e;--card:#131b18;--soft:#1b2622;--fg:#e9f2ed;--mut:#8da197;--ac:#4fd1b0;--on:#04221a;--bd:#25332d;--hz:#e9b12c;--hzt:#1a1200;--good:#4fd18a;--warn:#e9b12c;--bad:#ff6b82;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}
*{-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:10px 12px 116px}
h1{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:6px 2px 12px;font-weight:700}h1 span{color:var(--ac);margin-left:6px}
[hidden]{display:none !important}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.card>b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
section.card:has(#rate:empty){display:none}
label{display:block;font-size:12px;color:var(--mut);line-height:1.35}
textarea,input,select{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:10px 12px;margin-top:4px;border:1px solid transparent;border-radius:12px;background:var(--soft);color:var(--fg)}
textarea:focus,input:focus,select:focus{outline:2px solid var(--ac)}
#pairs{font:600 18px ui-monospace,Menlo,monospace}
input[type=range]{padding:0;height:32px;background:none;accent-color:var(--ac);margin-top:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
button{font:inherit;border:0;border-radius:999px;padding:11px 16px;background:var(--ac);color:var(--on);font-weight:700;cursor:pointer;transition:transform .08s}
button:active{transform:scale(.96)}
button.s{background:var(--soft);color:var(--fg);padding:8px 13px;font-weight:600;font-size:14px}
details{margin-top:6px}summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;font-weight:700;font-size:15px}summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .15s;margin-right:4px;flex:none}details[open]>summary::after{transform:rotate(225deg)}
summary small{display:block;font-weight:400;color:var(--mut);font-size:12px}
details.g,.card>details{border-top:1px solid var(--bd)}details>.row{padding-bottom:10px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,38%);grid-template-areas:"sec sec" "big fb" "fr fb" "hint fb" "nxt nxt" "strip strip" "dots dots" "clock clock" "dock dock";column-gap:12px;background:linear-gradient(180deg,var(--card),var(--soft))}
.stage>#sec{grid-area:sec;font-size:13px;color:var(--mut);min-height:34px;line-height:1.35}
.stage>#big{grid-area:big;align-self:end;font-size:clamp(44px,15vw,84px);font-weight:800;letter-spacing:-.02em;line-height:1.05;text-align:center;border-radius:16px;padding:8px 4px;white-space:nowrap;overflow:hidden}
#big.hz{background:var(--hz);color:var(--hzt)}
.stage>#fr{grid-area:fr;font:700 15px ui-monospace,Menlo,monospace;text-align:center;margin:0}
.stage>#fb{grid-area:fb;align-self:center;width:100%;max-width:100% !important;margin:0 !important}
.stage>#hint{grid-area:hint;text-align:center;font-size:12px;color:var(--mut);align-self:start}
.stage>#nxt{grid-area:nxt;text-align:center;font-size:17px;font-weight:700;background:rgba(127,127,127,.13);padding:9px 12px;border-radius:14px;margin:10px 0 8px}#nxt:empty{display:none}
#strip{grid-area:strip;display:flex;gap:6px;overflow-x:auto;position:relative;padding:2px 0 6px;scrollbar-width:none}#strip::-webkit-scrollbar{display:none}
.ch{flex:0 0 auto;min-width:64px;text-align:center;border:2px solid transparent;border-radius:14px;padding:8px 6px;font-weight:700;background:rgba(127,127,127,.13);cursor:pointer}
.ch small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.ch.on{border-color:var(--ac);background:var(--card)}
.ch.h2{background:var(--hz);color:var(--hzt)}.ch.h2 small{color:var(--hzt)}.ch.h1{box-shadow:inset 0 -4px 0 var(--hz)}
#dots{grid-area:dots;display:flex;gap:6px;margin:6px 0}#dots i{flex:1;height:8px;border-radius:4px;background:rgba(127,127,127,.25)}#dots i.on{background:var(--ac)}
#clock{grid-area:clock;text-align:center;font-size:12px;color:var(--mut)}
.stage>.dock{grid-area:dock;display:grid;grid-template-columns:repeat(6,1fr);gap:10px 8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)}
.dock>label{grid-column:span 2}.dock>label:first-child{grid-column:1/-1}.dock>label:first-child b{float:right;font-size:18px;color:var(--ac)}
.pr{display:flex;align-items:center;justify-content:space-between;gap:8px}
#rate .pr{padding:8px 0;border-top:1px solid var(--bd)}#rate .pr:first-child{border-top:0}#rate .pr>span:first-child{font:700 17px ui-monospace,Menlo,monospace}
#rate .s{font-weight:700}#rate .s:nth-of-type(1){color:var(--good)}#rate .s:nth-of-type(2){color:var(--warn)}#rate .s:nth-of-type(3){color:var(--bad)}
#plan .pr{padding:9px 12px;margin:6px 0;background:var(--soft);border-radius:12px;font-size:14px}
#qu .pr{flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--bd)}#qu select{width:auto;display:inline-block;padding:6px 8px;margin:0}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:12px}.seg button{flex:1;background:none;color:var(--mut);border-radius:11px;padding:10px 4px;font-size:13px}.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--sh)}
.lb{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--bd);font-size:14px}.lb b{font-size:15px}.lb .dg{font:12px ui-monospace,Menlo,monospace;color:var(--mut);margin:2px 0 4px;word-break:break-word}
.lb>span{display:flex;flex-direction:column;gap:6px}.lb>span button:first-child{background:var(--ac);color:var(--on)}
.ok{display:inline-block;background:var(--hz);color:var(--hzt);border-radius:999px;padding:2px 9px;margin:2px 4px 0 0;font-weight:700;font-size:12px}
.cat{display:inline-block;margin:16px 0 2px;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
#ctx p{margin:8px 0;padding:10px 12px;background:var(--soft);border-radius:12px;font-size:14px}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(540px,calc(100% - 20px));display:flex;gap:4px;align-items:center;padding:6px;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:26px;box-shadow:0 8px 28px rgba(0,0,0,.22);z-index:10;box-sizing:border-box}
#bar .tb{flex:1;background:none;color:var(--mut);border-radius:18px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700}
#bar .tb.on{color:var(--ac);background:var(--soft)}
#bar #go{margin:0;width:auto;flex:1.7;padding:14px 12px;font-size:16px;border-radius:20px}#bar #go.run{background:var(--bad);color:#fff}
.st{background:var(--soft);border-radius:14px;padding:10px 12px;margin:10px 0}.st.rest{background:transparent;border:2px dashed var(--bd)}
.st .sh{display:flex;justify-content:space-between;align-items:center}.st .sh b{font-size:14px}.st .sh button{padding:6px 10px;margin-left:4px;background:var(--card)}
.st .row{margin-top:6px}.st .w2{grid-column:1/-1}.rtbar{display:flex;gap:8px;margin-top:10px}.rtbar button{flex:1}
</style></head><body><main>
<h1>Chord Switch Trainer</h1>
<section class="card">
<label for="pairs"><b style="font-size:16px;color:var(--fg)">Your problem switches</b><br>Two chords per pair, as the shapes you play: G-C, Bm-F#, Cmaj7-B</label>
<textarea id="pairs" rows="2">G-C, Am-F</textarea>
<div class="row">
<label>BPM<input id="bpm" type="number" value="80" min="40" max="200"></label>
<label>Beats per chord<select id="bpc"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label>
<label>Session minutes<input id="mins" type="number" value="10" min="1" max="60"></label>
<label>Hazard flag<select id="flag"><option value="2">Bold</option><option value="1">Subtle</option><option value="0">Off</option><option value="f">Auto-fade as you improve</option></select></label>
<label>Other chords<select id="cx"><option value="tri">Triads</option><option value="7">7th chords</option><option value="mix">Mixed</option></select></label>
<label>Shape family<select id="fam"><option value="a">Auto, lowest fret</option><option value="E">E shape</option><option value="A">A shape</option><option value="C">C shape</option><option value="D">D shape</option><option value="x">Explore (vary shapes)</option></select></label>
<label>Capo<select id="capo"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option value="r">Random each song</option></select></label>
<label><br><input id="open" type="checkbox" checked style="width:auto"> Allow open chords</label>
<label>Sound<select id="snd"><option value="p">Pad</option><option value="s">Strum</option><option value="o">Off</option></select></label>
<label>Strum type<select id="stm"><option value="d">Down, every beat</option><option value="u">Down-up, 8ths</option><option value="f">Folk: D DU UDU</option><option value="r">Offbeat upstrokes</option><option value="a">Arpeggio (fingerstyle)</option><option value="s">Single strum per chord</option></select></label>
<label>Session type<select id="sm"><option value="c">Chained practice</option><option value="g">Generated songs</option></select></label>
</div>
<details><summary>Your own song form (optional)</summary>
<textarea id="cust" rows="6" placeholder="Main: [Cmaj7:4 B:4]x3 G:8&#10;or: Cmaj7-B, Cmaj7-B, Cmaj7-B, G:8&#10;Key: C   (optional)&#10;Beats: 4   (default counts)"></textarea>
<label>One line per section, optionally named (Verse: ...). Chord:counts sets length, e.g. G:8. Chords with no number use the Beats line, or the Beats per chord setting. [ ... ]x3 repeats a group. Commas and hyphens just separate chords. A Key line shows degrees. Leave empty to auto-generate.</label>
<button class="s" onclick="playCust()" style="margin-top:8px;width:100%">Play this program</button></details>
<button id="go">Start session</button>
</section>
<section class="card">
<div id="sec">Add your problem pairs and press Start.</div>
<div id="big">–</div><div id="fr"></div><svg id="fb" viewBox="0 0 200 175" style="display:block;margin:6px auto;max-width:200px;color:var(--fg)"></svg><div id="hint"></div><div id="nxt"></div>
<div id="strip"></div><div id="dots"></div><div id="clock"></div>
<div class="row" style="align-items:end"><label>Tempo <b id="lbv"></b><input id="lbpm" type="range" min="40" max="200" value="80"></label>
<label>Beats per chord<select id="lbpc"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label>
<label>Sound<select id="lsnd"><option value="p">Pad</option><option value="s">Strum</option><option value="o">Off</option></select></label>
<label>Strum type<select id="lstm"><option value="d">Down, every beat</option><option value="u">Down-up, 8ths</option><option value="f">Folk: D DU UDU</option><option value="r">Offbeat upstrokes</option><option value="a">Arpeggio</option><option value="s">Single strum</option></select></label></div>
</section>
<section class="card"><b>Practice chain</b><div id="plan"><label>Press Start with Chained practice to build the blocks for your session time.</label></div></section>
<section class="card"><b>How did those switches feel?</b><div id="rate"></div></section>
<section class="card"><b>Same pair, different keys</b><div id="ctx"></div></section>
<section class="card"><b>My chain (from the library)</b><div id="qu"></div><button onclick="playQ()" style="width:100%;margin-top:8px">Play my chain</button><label>Plays in order and loops until the session time is up.</label></section>
<section class="card"><b>Progression library</b>
<div class="row"><label>Show<select id="lf"><option value="a">All progressions</option><option value="h">Only with my pairs</option></select></label>
<label>Drill in key<select id="lk"><option value="a">Auto (key with my pair)</option><option value="0">C</option><option value="1">C#/Db</option><option value="2">D</option><option value="3">Eb</option><option value="4">E</option><option value="5">F</option><option value="6">F#</option><option value="7">G</option><option value="8">Ab</option><option value="9">A</option><option value="10">Bb</option><option value="11">B</option></select></label></div>
<label>Amber tags show the keys where your pair occurs, with the degrees. Tap Drill to loop that progression.</label>
<div id="lib"></div></section>
</main>
<script>
const $=id=>document.getElementById(id),BASE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const NS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],NF=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const FL=[5,10,3,8,1],SUF={M:'',m:'m',7:'7',M7:'maj7',m7:'m7',sus4:'sus4',sus2:'sus2'};
const OPENF={C:'x32010',A:'x02220',G:'320003',E:'022100',D:'xx0232',Am:'x02210',Em:'022000',Dm:'xx0231',A7:'x02020',D7:'xx0212',E7:'020100',G7:'320001',C7:'x32310',B7:'x21202',Am7:'x02010',Em7:'020000',Dm7:'xx0211',Cmaj7:'x32000',Dmaj7:'xx0222',Amaj7:'x02120',Emaj7:'021100',Asus4:'x02230',Asus2:'x02200',Dsus4:'xx0233',Dsus2:'xx0230',Esus4:'022200'},OM=[40,45,50,55,59,64];
const SH={E:{p:4,o:{M:[0,2,2,1,0,0],m:[0,2,2,0,0,0],7:[0,2,0,1,0,0],M7:[0,2,1,1,0,0],m7:[0,2,0,0,0,0],sus4:[0,2,2,2,0,0]}},
A:{p:9,o:{M:[null,0,2,2,2,0],m:[null,0,2,2,1,0],7:[null,0,2,0,2,0],M7:[null,0,2,1,2,0],m7:[null,0,2,0,1,0],sus4:[null,0,2,2,3,0],sus2:[null,0,2,2,0,0]}},
C:{p:9,o:{M:[null,0,-1,-3,-2,-3],7:[null,0,-1,0,-2,-3],M7:[null,0,-1,-3,-3,-3]}},
D:{p:2,o:{M:[null,null,0,2,3,2],m:[null,null,0,2,3,1],7:[null,null,0,2,1,2],M7:[null,null,0,2,2,2],m7:[null,null,0,2,1,1],sus4:[null,null,0,2,3,3],sus2:[null,null,0,2,3,0]}}};
const DEG={maj:{I:[0,'M','M7'],ii:[2,'m','m7'],iii:[4,'m','m7'],IV:[5,'M','M7'],V:[7,'M','7'],vi:[9,'m','m7']},min:{i:[0,'m','m7'],III:[3,'M','M7'],iv:[5,'m','m7'],v:[7,'m','m7'],V:[7,'M','7'],VI:[8,'M','M7'],VII:[10,'M','7']}};
const NEXT={maj:{I:['IV','V','vi','ii'],ii:['V','IV'],iii:['vi','IV'],IV:['I','V','ii'],V:['I','vi','IV'],vi:['IV','ii','V']},min:{i:['VI','iv','VII','III'],III:['VII','iv','VI'],iv:['i','VII','V'],v:['i','VI'],V:['i','VI'],VI:['VII','III','iv'],VII:['i','III','VI']}};
let sc={},S=null,si=0,ii=0,beat=0,iv=null,t0=0,ac=null,cap=0,pf=0,cin=0;
try{sc=JSON.parse(localStorage.getItem('cst-sc')||'{}')||{};const p=localStorage.getItem('cst-pairs');if(p)$('pairs').value=p;const c=localStorage.getItem('cst-cust');if(c)$('cust').value=c}catch(e){}
const pick=a=>a[Math.random()*a.length|0];
function parse(s){const m=/^([A-G])([#b]?)(maj7|M7|m7|sus4|sus2|7|m)?$/.exec((s||'').trim());if(!m)return null;const x=m[3];return{raw:m[0],r:(BASE[m[1]]+(m[2]=='#'?1:m[2]=='b'?11:0))%12,q:!x?'M':x=='maj7'||x=='M7'?'M7':x}}
const nm=(r,q,t,mode)=>(FL.includes(mode=='maj'?t:(t+3)%12)?NF:NS)[r]+SUF[q];
const kn=(t,mode)=>nm(t,'M',t,mode)+(mode=='maj'?' major':' minor');
function lab(r,q,t,mode){return Object.keys(DEG[mode]).find(l=>{const d=DEG[mode][l];return(t+d[0])%12==r&&(q==d[1]||q==d[2]||q[0]=='s')})||'·'}
function ctxs(s){const out=[];for(const mode of['maj','min'])for(let t=0;t<12;t++){const a=lab(s[0].r,s[0].q,t,mode),b=lab(s[1].r,s[1].q,t,mode);if(a!='·'&&b!='·'&&(s[0].r!=s[1].r||s[0].q!=s[1].q))out.push({t,mode,a,b})}return out}
function getPairs(all){return $('pairs').value.split(/[,;\n]+/).map(x=>x.split(/\s*[-–>→]+\s*/).map(parse)).filter(p=>p.length==2&&p[0]&&p[1]).map(p=>{const s=p.map(c=>({...c,r:(c.r+cap)%12}));return{c:p,s,k:p[0].raw+'-'+p[1].raw,cx:ctxs(s)}}).filter(p=>all||p.cx.length)}
function cands(sr,q,ao){const L=[];const on=NS[sr]+SUF[q];if(ao&&OPENF[on])L.push({f:0,fam:'open',fr:OPENF[on].split('').join('·'),a:[...OPENF[on]].map(x=>x=='x'?null:+x)});
for(const k in SH){const s=SH[k],o=s.o[q];if(!o)continue;let f=(sr-s.p+12)%12;if(k=='C'){if(f<3)f+=12;if(f==3)continue}else if(f==0)f=12;
const a=o.map(x=>x==null?null:f+x);if(a.some(x=>x!=null&&(x<0||x>15)))continue;L.push({f,fam:k,a,fr:a.map(x=>x==null?'x':x).join('·')})}return L}
function choose(sr,q){const L=cands(sr,q,$('open').checked),fm=$('fam').value;if(!L.length)return null;
if(fm=='x'){const w=L.filter(z=>z.fam!='open'&&Math.abs(z.f-pf)<=4);return pick(w.length?w:L)}
return L.find(z=>z.fam==fm)||L.sort((a,b)=>a.f-b.f)[0]}
function mk(r,q,t,mode,l,hz,raw){const sr=(r-cap+12)%12,c=choose(sr,q);if(c)pf=c.f;
return{l,n:raw||nm(r,q,t,mode),hz,sr,fam:c?c.fam:'',a:c?c.a:null,fr:c?c.fr:'',hint:(cap?'play '+NS[sr]+SUF[q]+' · ':'')+(c?(c.fam=='open'?'open shape':c.fam+'-shape, fret '+c.f):'no shape found')}}
const wt=p=>1+Math.max(0,(sc[p.k]?.m||0)*2-(sc[p.k]?.c||0)*.5);
function pickW(a){const w=a.map(wt);let r=Math.random()*w.reduce((x,y)=>x+y,0);for(let i=0;i<a.length;i++)if((r-=w[i])<=0)return a[i];return a[0]}
function walk(mode,from,n){const r=[];let c=from;for(let i=0;i<n;i++){c=pick(NEXT[mode][c]);r.push(c)}return r}
function pre(mode,a){const c=Object.keys(NEXT[mode]).filter(p=>NEXT[mode][p].includes(a));return pick(c.length?c:Object.keys(NEXT[mode]))}
function sec(name,t,mode,labels,hz,P){const CX=$('cx').value;return{name,t,mode,ps:[P],items:labels.map((l,i)=>{const d=DEG[mode][l],r=(t+d[0])%12,k=hz.indexOf(i),q=k>=0?P.s[k].q:CX=='tri'?d[1]:CX=='7'?d[2]:Math.random()<.5?d[1]:d[2];return mk(r,q,t,mode,l,k>=0)})}}
function build(){const ps=getPairs();if(!ps.length)return null;
const P=pickW(ps),cs=[...P.cx].sort(()=>Math.random()-.5),m=cs[0],mode=m.mode,t=m.t;
const same=ps.filter(p=>p.cx.some(c=>c.t==t&&c.mode==mode)),cf=p=>p.cx.find(c=>c.t==t&&c.mode==mode);

[grp('Session','Length, type, hazard flag',['mins','sm','flag'],1),grp('Tempo & sound','Tempo, beats, sound, strum',['bpm','bpc','snd','stm'],1),grp('Chords & shapes','Chord types, shape family, capo, open chords',['cx','fam','capo','open'],0)].forEach(d=>rw.parentNode.insertBefore(d,rw));rw.remove();

$('go').addEventListener('click',()=>{if(iv)tab('play')});
let wl=null;const wake=async on=>{try{if(on&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}else if(!on&&wl){await wl.release();wl=null}}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&iv)wake(true)});
