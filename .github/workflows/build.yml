When creating the workflow in GitHub, use the standard path:
.github/workflows/build.yml
Copy everything below this divider into the workflow editor and commit the file.
============================================================

name: Build Chord Switch Trainer APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android

      - name: Keep screen awake during practice
        run: |
          cat > android/app/src/main/java/com/kapitol/chordswitch/MainActivity.java <<'JAVA'
          package com.kapitol.chordswitch;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
            }
          }
          JAVA

      - name: Sync app files and native assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chord-switch-strum-trainer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
